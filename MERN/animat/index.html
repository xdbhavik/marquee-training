<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="fixed-menu"></div>
    <div class="pointer"><span></span></div>

    <nav class="navbar">
      <div class="left">
        <div class="logo">
          <span>STUDIO NAMMA</span>
        </div>
        <div class="mode">
          <span>DARK</span>
          <span>MODE</span>
        </div>
      </div>
      <div class="left">
        <div class="menu">
          <span id="menuBtn">MENU</span>
        </div>
        <div class="connect">LET'S TALK!</div>
      </div>
    </nav>
    <div class="hero-wrapper">
      <section class="hero">
        <p>WE THINK</p>
        <p>CRAFT AND</p>
        <p>DESIGN</p>
      </section>
    </div>
    <div class="cursor-box">
      <video src="cursorvid.mp4" autoplay muted loop playsinline></video>
    </div>

    <section class="videoshell">
      <video
        src="matera-highlight-2.mp4"
        autoplay
        frameborder="0"
        muted
        loop
        playsinline
      ></video>
    </section>

    <!-- <div class="hero hero-wrapper">
    <section class="hero"></section>
</div> -->

    <div class="play">
      <section class="playtext">
        <p>PLAYGROUND</p>
      </section>
    </div>

    <div class="outergrid">
      <div class="blocks">
        <img class="block-img"
          src="block1.webp"
          alt=""
        />
        <video
          src="matera-highlight-2.mp4"
          class="block-video"
          muted
          loop
          playsinline
          autoplay
        ></video>
      </div>
      <div class="blocks">
        <img class="block-img"
          src="block2.webp"
          alt=""
        /><video
          src="block2.mp4"
          class="block-video"
          muted
          loop
          playsinline
          autoplay

          
        ></video>
      </div>
      <div class="blocks">
        <img class="block-img"
          src="block3.webp"
          alt=""
        /><video
          src="block3.mp4"
          class="block-video"
          muted
          loop
          playsinline
          autoplay
        ></video>
      </div>
      <div class="blocks">
        <img class="block-img"
          src="block4.webp"
          alt=""
        /><video
          src="block4.mp4"
          class="block-video"
          muted
          autoplay
          loop
          playsinline
        ></video>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
