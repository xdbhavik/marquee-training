<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application-Form
    </title>
</head>
<body>
    <!-- header  -->
    <header>
        <h1>Job Application</h1>
    </header>

    <!-- form  -->
     <main>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="John Doe" required>

                <br>

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="abc@example.com" required>

                <br>

                <label for="number">Phone Number:</label>
                <input type="tel" id="number" placeholder="123-4567-890">

                <br>

                <label for="dob">DOB:</label>
                <input type="date" id="dob" required>

                <br>

                
            </fieldset>

            <!-- Gender Information  -->

            <fieldset>
                <legend>Gender Information</legend>
                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>
                <br>
                <input type="radio" name="gender">
                <label for="female">Female</label>
                <br>
                <input type="radio" name="gender">
                <label for="bag">AI clanker</label>
            </fieldset>

            <!-- Skills  -->

            <fieldset>
                <legend>Skills</legend>

                <input type="checkbox" id="mern">
                <label for="mern">MERN</label>
<br>
                <input type="checkbox" id="cloud">
                <label for="cloud">Cloud</label>
                <br>
                <input type="checkbox" id="n8n">
                <label for="n8n">n8n</label>
                <br>
                <input type="checkbox" id="skill_issue">
                <label for="skill_issue">Skill Issue:(</label>
                <br>

            </fieldset>

            <!-- Additional Information  -->

            <fieldset>
                <legend>Additional Information</legend>

                <!-- Experience info  -->
                <label for="xp">Years of Experience:</label>
                <select id="xp">
                    <option disabled selected>Select Years</option>
                    <option>Fresher</option>
                    <option>1 Year</option>
                    <option>2 Year</option>
                    <option>3 Year</option>
                    <option>3+</option>
                </select>
<br>

                <!-- Location  -->
<label for="loc">Prefered Location:</label>
                <select name="" id="">
                    <option disabled selected>Location</option>
                    <option value="vd">Vadodara</option>
                    <option value="hyd">Hyderabad</option>
                    <option value="blr">Bangaluru</option>
                    <option value="Noida">Noida</option>
                </select>

                <br>

                <label for="resume">Resume </label>
                <input type="file" name="" id="resume">

<br>

            </fieldset>
            <br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </form>
     </main>

</body>


</html>
