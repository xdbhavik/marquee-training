<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration <Form></Form></title>
    
  </head>
  <body>
    <header>
        
    <!-- heading -->
    <h1>Student Registration Form</h1>
    <hr>
    </header>

    <br>
    <form>
      <!-- Personal Information -->
      <fieldset>

        <legend>Personal Information</legend>
        
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="John Doe" required/>
        
        <br />
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="abc@example.com" required/>
        
        <br />
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="********" required/>
        
        <br />
        <label for="number">Phone Number:</label>
        <input type="tel" id="number" placeholder="123-456-7890" required>
        
        <br>
        <label for="dob">DOB:</label>
        <input type="date" id="dob" required>
        <br>

        <br>
        <label for="gender">Gender:</label>
        <br>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" required>
        <br>
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female">
        <br>
         <label for="other">Other</label>
        <input type="radio" name="gender" id="other">

        </fieldset>

      <br>
      <!-- Course Information  -->
       <fieldset>
        <legend>Course Information</legend>
        <select name="" id="course" >
            <option value="">MERN</option>
            <option value="">DSA</option>
            <option value="">OS</option>
            <option value="">System Design</option>
        </select>
       </fieldset>
    </form>
  </body>
</html>
