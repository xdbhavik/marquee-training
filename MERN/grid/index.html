<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto auto auto;
            /* column-gap: 5px;
            /* row-gap: 5px; or use gap for both  */
            gap: 10px;

            /* justify-content: end; */


            background-color: dodgerblue;
            padding: 10px;

        }
        .container div {
            background-color: #f1f1f1f1;
            border: 1px solid black;
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>5</div>
        <div>5</div>
        <div>5</div>
        <div>5</div>
    </div>
</body>
</html>
