<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #004cff;
        }

        .container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
    
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }

       

        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: rgb(90, 180, 15);
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }


        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
            color: black;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <!-- <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                > -->
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" id="loginBtn">Login</button>
        </form>

        <p class="message" id="message"></p>
    </div>
<script src="script.js"></script>
</body>
</html>
