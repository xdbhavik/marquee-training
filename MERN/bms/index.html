<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookmyshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="parent">
        <div id="header">
            <div id="top">
                <div id="name"></div>
                <div id="searchbar"><input type="text" placeholder="Search"></div>
                <div id="topbuttons">
                    <div id="loc">Nanded</div>
                    <div id="pfp"></div>
                    <div id="burgermenu"></div>
                </div>

            </div>
            <div id="nav">
                <div id="leftnav">
                    <div class="nav-items">Movies</div>
                    <div class="nav-items">Stream</div>
                    <div class="nav-items">Events</div>
                    <div class="nav-items">Plays</div>
                    <div class="nav-items">Sports</div>
                    <div class="nav-items">Activities</div>
                </div>
                <div id="rightnav">
                    <div class="nav-items">ListYourShow</div>
                    <div class="nav-items">Corporates</div>
                    <div class="nav-items">Offers</div>
                    <div class="nav-items">Gift Cards</div>
                </div>
            </div>
        </div>

        <div id="content">
            <div id="hero"></div>
            <div id="recom">
                <div id="rectext"><p>Recommended Movies</p></div>
                <div id="poster-row">
                    <div class="movie-card">
                        <div class="posters"></div>
                        <h3>7 Crore</h3>
                        <p>Comedy/Romantic</p>
                    </div>
                    <div class="movie-card">
                        <div class="posters"></div>
                        <h3>7 Crore</h3>
                        <p>Comedy/Drama</p>
                    </div>
                    <div class="movie-card">
                        <div class="posters"></div>
                        <h3>7 Crore</h3>
                        <p>Action/Drama/Historical</p>
                    </div>
                    <div class="movie-card">
                        <div class="posters"></div>
                        <h3>7 Crore</h3>
                        <p>Drama/Musical/Romantic</p>
                    </div>
                    <div class="movie-card">
                        <div class="posters"></div>7 Crore
                        <h3>7 Crore</h3>
                        <p>Action/Thriller</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
